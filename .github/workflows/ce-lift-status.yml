# Posts the build result of a Checkout Engine lift pull request to Slack, green or red, once all of its
# checks have finished. Call it as the last job of the workflow that builds the lift branch, with
# `needs` on the build jobs and `if: always()`. See docs/ce-lift-status.md.
name: Checkout Engine lift status
on:
  workflow_call:
    inputs:
      slack-channel:
        description: The Slack channel to post the result to.
        required: true
        type: string
      dependency-name:
        description: The dependency name used in the message, the same as in ce-dependency-lift.
        required: false
        default: CE
        type: string
    secrets:
      SECRET_AUTH:
        required: true

jobs:
  status:
    name: Lift build status
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Collect check results
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          DEPENDENCY_NAME: ${{ inputs.dependency-name }}
          SELF: Lift build status
        run: |
          # ce-dependency-lift names the branch chore/update-<name>-version-<X-Y-Z>.
          version="${BRANCH##*-version-}"
          version="${version//-/.}"
          prefix="${DEPENDENCY_NAME} version ${version} is available"

          # A newer lift closes this pull request; a build that finishes after that posts nothing.
          pr="$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json number,state,url)"
          if [ "$(jq -r .state <<< "$pr")" != OPEN ]; then
            echo "The lift pull request is $(jq -r .state <<< "$pr"), nothing to post."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number="$(jq -r .number <<< "$pr")"
          url="$(jq -r .url <<< "$pr")"

          # Other workflows on the pull request are normally done by now; wait up to 2 minutes for any
          # that are not. This job's own check is left out, as it is still running. Only the check names
          # are read: the workflow of a check needs `actions: read`, which callers don't grant.
          buckets=''
          for _ in $(seq 1 12); do
            if buckets="$(gh pr checks "$number" --repo "$GITHUB_REPOSITORY" --json name,bucket \
              --jq '[.[] | select(.name == env.SELF or (.name | endswith(" / " + env.SELF)) | not) | .bucket]')"; then
              [ "$(jq '[.[] | select(. == "pending")] | length' <<< "$buckets")" = 0 ] && break
            else
              buckets=''
            fi
            sleep 10
          done

          count() { jq --arg buckets "$1" '[.[] | select(. as $b | $buckets | split(",") | index($b))] | length' <<< "$buckets"; }
          if [ -z "$buckets" ] || [ "$(jq length <<< "$buckets")" = 0 ]; then
            text="🔴 ${prefix}, but the build status could not be read, check the pull request: ${url}"
          elif [ "$(count fail,cancel)" != 0 ]; then
            text="🔴 ${prefix}, build failed, needs attention: ${url}"
          elif [ "$(count pending)" != 0 ]; then
            text="🔴 ${prefix}, build not finished, needs attention: ${url}"
          else
            text="🟢 ${prefix}, build passed, ready to merge: ${url}"
          fi
          echo "text=${text}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: steps.status.outputs.skip != 'true'
        uses: extenda/actions/slack-notify@v0
        with:
          text: ${{ steps.status.outputs.text }}
          service-account-key: ${{ secrets.SECRET_AUTH }}
          channel: ${{ inputs.slack-channel }}
