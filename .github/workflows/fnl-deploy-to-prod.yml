name: Deploy prod

on: 
  workflow_call:
    secrets:
      GCLOUD_AUTH_PROD:
        required: true
      SECRET_AUTH:
        required: true
      STYRA_TOKEN:
        required: false
    inputs:
      image_name:
        required: true
        type: string
      slack-channel:
        description: Name of the channel to notify failing action
        required: true
        type: string
      update-dns:
        description: |
          Set how DNS should be updated. Use `if-missing` to only create DNS if an
          entry does not exist. Use `always` to update the DNS entry if is missing or
          if the existing entry does not match the load balancer IP for the service.
        required: false
        type: string
        default: if-missing
      notify-slack-on-fail:
        description: If true notifies slack channel specified in secrets in case this workflow fails
        default: false
        type: boolean
        required: false
      das-deploy:
        default: false
        type: boolean
        required: false
      permission-prefix:
        type: string
        required: false
      service-name:
        type: string
        required: false
      canary-wait-minutes:
        description: Maximum minutes to wait for a previous canary rollout to reach 100% traffic before deploying
        type: number
        required: false
        default: 120

jobs:
  deploy:
      runs-on: ubuntu-latest
      concurrency:
        group: fnl-prod-${{ github.repository }}
        cancel-in-progress: false
      steps:
        - uses: actions/checkout@v3
          with:
            fetch-depth: 0

        - uses: extenda/actions/setup-gcloud@v0
          id: gcloud
          with:
            service-account-key: ${{ secrets.GCLOUD_AUTH_PROD }}

        - name: Wait for previous canary to reach 100%
          shell: bash
          run: |
            SERVICE=$(yq '.cloud-run.service // ""' cloud-deploy.yaml)
            if [ -z "$SERVICE" ]; then
              echo "No Cloud Run service in cloud-deploy.yaml, skipping canary wait"
              exit 0
            fi
            DEADLINE=$(( $(date +%s) + WAIT_MINUTES * 60 ))
            while true; do
              # Same check as extenda/actions cloud-deploy build-manifest.js: revisions with Active=True in europe-west1.
              ACTIVE=$(gcloud run revisions list --service "$SERVICE" --project "$PROJECT" \
                --region europe-west1 --format=json \
                | jq '[.[] | select(any(.status.conditions[]?; .type == "Active" and .status == "True"))] | length')
              if ! [[ "$ACTIVE" =~ ^[0-9]+$ ]]; then
                echo "::error::Could not read revisions for $SERVICE"
                exit 1
              fi
              if [ "$ACTIVE" -le 1 ]; then
                echo "$SERVICE has a single active revision"
                break
              fi
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "::error::$SERVICE still has $ACTIVE active revisions after $WAIT_MINUTES minutes (canary-wait-minutes)"
                exit 1
              fi
              echo "Canary in progress for $SERVICE ($ACTIVE active revisions), waiting..."
              sleep 60
            done
          env:
            PROJECT: ${{ steps.gcloud.outputs.project-id }}
            WAIT_MINUTES: ${{ inputs.canary-wait-minutes }}

        - uses: extenda/actions/gcp-secret-manager@v0
          if: ${{ inputs.das-deploy }}
          with:
            service-account-key: ${{ secrets.SECRET_AUTH }}
            secrets: |
              STYRA_TOKEN: ${{ secrets.STYRA_TOKEN }} 
          
        - name: DAS production deploy
          if: ${{ inputs.das-deploy }}
          uses: extenda/actions/styra-das-deploy@v0
          with:
            permission-prefix: ${{ inputs.permission-prefix }}
            service-name: ${{ inputs.service-name }}
            styra-das-token: ${{ secrets.STYRA_TOKEN }}

        - name: Create release
          uses: extenda/actions/conventional-release@v0
          id: release
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Add release tag to Docker image
          run: |
            gcloud container images add-tag \
              ${{ inputs.image_name }}:${{ github.sha }} \
              ${{ inputs.image_name }}:${{ steps.release.outputs.release-tag }}

        - name: Update latest tag
          run: |
            gcloud container images add-tag \
              ${{ inputs.image_name }}:${{ github.sha }} \
              ${{ inputs.image_name }}:latest

        - name: Deploy to Production
          uses: extenda/actions/cloud-deploy@v0
          with:
            secrets-account-key: ${{ secrets.SECRET_AUTH }}
            service-account-key: ${{ secrets.GCLOUD_AUTH_PROD }}
            image: ${{ inputs.image_name }}:${{ steps.release.outputs.release-tag }}
            update-dns: ${{ inputs.update-dns }}

        - name: Notify Slack if failed
          if: ${{ failure() && inputs.notify-slack-on-fail }}
          uses: extenda/actions/slack-notify@v0
          with:
            text: |
              *Deploy to prod failed for ${{ github.repository }}: ${{ github.workflow }}* :heavy_exclamation_mark:
              Deploy failed on ${{ github.event_name }} event. Workflow: ${{ github.workflow }}. Job: ${{github.job}}. Run id: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>
            channel: ${{ inputs.slack-channel }}
            service-account-key: ${{ secrets.SECRET_AUTH }}
