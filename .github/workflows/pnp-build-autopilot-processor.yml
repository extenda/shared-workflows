name: Merge to master 

on:
  workflow_call:
    secrets:
      SECRET_AUTH:
        required: true
      GCLOUD_AUTH_STAGING:
        required: true
    inputs:
      GCR_image_name:
        description: 'A name of the image to be created in GCR'
        required: true
        type: string
      path-to-pom:
        description: 'Path to the pom file, relative to the repository root (e.g. my-service/pom.xml when working-directory is my-service).'
        required: true
        type: string
      path-to-dockerfile:
        description: 'Path to the Dockerfile, relative to the repository root. The docker build context is working-directory.'
        required: true
        type: string
      slack-channel:
        description: 'A slack channel which needs to be notified in case of failure'
        required: false
        type: string
      pact-application-id:
        required: false
        type: string
      pact-webhook-id:
        required: false
        type: string
      working-directory:
        description: 'Directory of the Maven project, for repositories with several services. Defaults to the repository root.'
        required: false
        type: string
        default: ''
      service-definition:
        description: 'Path to kubernetes config file. For several services built from the same image, list one path per line; each is deployed to staging.'
        type: string
        required: true
      release-version:
        description: 'DEPRECATED, will be removed: if true, skips the staging deploy. It never deploys to prod; use pnp-processor-deploy-autopilot.yml with release-version: true for prod.'
        type: boolean
        required: false
        default: false
      jdk-distribution:
        description: 'JDK Distribution name'
        type: string
        required: false
        default: 'temurin'
      java-version:
        description: 'Java version used in the project'
        type: string
        required: false
        default: '17'
      use-old-setup-java:
        description: 'If true uses the java setup step of version 1'
        type: boolean
        required: false
        default: false
      do-pact-consumer-tests:
        description: 'If true runs tests defining data contracts'
        type: boolean
        required: false
        default: false
      do-pact-provider-tests:
        description: 'If true runs tests verifying implementation against data-contracts'
        type: boolean
        required: false
        default: false
      is-pact-consumer-can-i-deploy-dry-run:
        description: 'If true, consumer can-i-deploy step will be executed in dry-run mode'
        type: boolean
        required: false
        default: false
      is-pact-provider-can-i-deploy-dry-run:
        description: 'If true, provider can-i-deploy step will be executed in dry-run mode'
        type: boolean
        required: false
        default: false
      path-to-pact-tests:
        description: 'Path to pact test directory, relative to working-directory.'
        type: string
        required: false
        default: 'target/pacts'
      reuse-release:
        description: 'If true, instead of creating new release reuses the current one. Intended to be used in config-based multi-service deploy scenarios, when multiple service instances created from the same code base.'
        type: boolean
        required: false
        default: false
      tag-prefix:
        description: 'Release tag prefix. Must be provided in case of multiple projects in the same repository. Each project needs to have its own prefix. Use {service-prefix}-v format.'
        type: string
        required: false
        default: 'v'
      native-image:
        description: 'If true uses the GraalVm to compile app'
        type: boolean
        required: false
        default: false
      enable-kafka-streams-lint:
        description: 'If true runs Kafka Streams Lint'
        type: boolean
        required: false
        default: true
      trigger-synthetic-monitoring-tests:
        description: 'If true runs synthetic monitoring tests'
        type: boolean
        required: false
        default: true

# Pipeline flow (all checks passing):
#
#   PR / branch push                     master push
#   ────────────────                     ───────────
#   build-stage: test ─┐                 build-stage: test ─┐
#                lint ─┘ (parallel)                   lint ─┴─> image ─> release ─> staging (per service)
#   build: status check over build-stage (keeps the required check name "<caller job> / build")
#
# 1. build-stage pnp-processor-build-image.yml: test + lint in parallel, then on master the image
#             (package, docker push, Trivy, attestation). See the flow description in that file.
# 2. release  pnp-processor-release.yml, once: create the GitHub release (or reuse the current
#             one), tag the image with the release version, create the Pact staging release.
# 3. staging  pnp-processor-deploy-autopilot.yml for every path in service-definition (matrix):
#             deploy the release image to Autopilot staging, trigger synthetic monitoring tests,
#             record the deployment to staging in Pact. Skipped when the deprecated
#             release-version input is true.
#
# On non-master branches a newer push cancels the running jobs; master runs are never cancelled.
# Any failure on master is reported to slack-channel.

jobs:
  build-stage:
    uses: extenda/shared-workflows/.github/workflows/pnp-processor-build-image.yml@test/pnp-pipeline-reuse
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    secrets:
      SECRET_AUTH: ${{ secrets.SECRET_AUTH }}
      GCLOUD_AUTH_STAGING: ${{ secrets.GCLOUD_AUTH_STAGING }}
    with:
      GCR_image_name: ${{ inputs.GCR_image_name }}
      path-to-pom: ${{ inputs.path-to-pom }}
      path-to-dockerfile: ${{ inputs.path-to-dockerfile }}
      slack-channel: ${{ inputs.slack-channel }}
      pact-application-id: ${{ inputs.pact-application-id }}
      pact-webhook-id: ${{ inputs.pact-webhook-id }}
      jdk-distribution: ${{ inputs.jdk-distribution }}
      java-version: ${{ inputs.java-version }}
      use-old-setup-java: ${{ inputs.use-old-setup-java }}
      do-pact-consumer-tests: ${{ inputs.do-pact-consumer-tests }}
      do-pact-provider-tests: ${{ inputs.do-pact-provider-tests }}
      is-pact-consumer-can-i-deploy-dry-run: ${{ inputs.is-pact-consumer-can-i-deploy-dry-run }}
      is-pact-provider-can-i-deploy-dry-run: ${{ inputs.is-pact-provider-can-i-deploy-dry-run }}
      native-image: ${{ inputs.native-image }}
      enable-kafka-streams-lint: ${{ inputs.enable-kafka-streams-lint }}
      working-directory: ${{ inputs.working-directory }}
      path-to-pact-tests: ${{ inputs.path-to-pact-tests }}
      tag-prefix: ${{ inputs.tag-prefix }}

  # Required status check: keeps the check name "<caller job> / build" that branch protection
  # expects. Passes when the build stage succeeded or was skipped.
  build:
    if: always()
    needs: build-stage
    runs-on: ubuntu-latest
    steps:
      - name: Warn about deprecated inputs
        if: ${{ inputs.release-version == true }}
        run: echo "::warning title=Deprecated input::release-version is deprecated and will be removed. It only skips the staging deploy; prod deploys use pnp-processor-deploy-autopilot.yml with release-version true."

      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]

  release:
    if: github.ref == 'refs/heads/master'
    needs: build-stage
    uses: extenda/shared-workflows/.github/workflows/pnp-processor-release.yml@test/pnp-pipeline-reuse
    permissions:
      contents: write
      id-token: write
    # pnp-processor-release.yml takes these values as secrets.
    secrets:
      GCR_image_name: ${{ inputs.GCR_image_name }}
      slack-channel: ${{ inputs.slack-channel }}
      pact-application-id: ${{ inputs.pact-application-id }}
      SECRET_AUTH: ${{ secrets.SECRET_AUTH }}
      GCLOUD_AUTH_STAGING: ${{ secrets.GCLOUD_AUTH_STAGING }}
    with:
      do-pact-consumer-tests: ${{ inputs.do-pact-consumer-tests }}
      reuse-release: ${{ inputs.reuse-release }}
      tag-prefix: ${{ inputs.tag-prefix }}

  # Turns service-definition (one path per line) into a JSON list for the staging matrix.
  services:
    if: github.ref == 'refs/heads/master' && inputs.release-version == false
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: List service definitions
        id: list
        env:
          SERVICE_DEFINITION: ${{ inputs.service-definition }}
        run: |
          LIST=$(printf '%s\n' "$SERVICE_DEFINITION" | jq -R -s -c 'split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "Service definitions: $LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

  staging:
    if: github.ref == 'refs/heads/master' && inputs.release-version == false
    needs: [release, services]
    strategy:
      fail-fast: false
      matrix:
        service-definition: ${{ fromJSON(needs.services.outputs.list) }}
    uses: extenda/shared-workflows/.github/workflows/pnp-processor-deploy-autopilot.yml@test/pnp-pipeline-reuse
    permissions:
      contents: read
      id-token: write
    # pnp-processor-deploy-autopilot.yml takes these values as secrets.
    secrets:
      GCR_image_name: ${{ inputs.GCR_image_name }}
      slack-channel: ${{ inputs.slack-channel }}
      pact-application-id: ${{ inputs.pact-application-id }}
      SECRET_AUTH: ${{ secrets.SECRET_AUTH }}
      GCLOUD_AUTH: ${{ secrets.GCLOUD_AUTH_STAGING }}
    with:
      service-definition: ${{ matrix.service-definition }}
      do-pact-consumer-tests: ${{ inputs.do-pact-consumer-tests }}
      tag-prefix: ${{ inputs.tag-prefix }}
      trigger-synthetic-monitoring-tests: ${{ inputs.trigger-synthetic-monitoring-tests }}
