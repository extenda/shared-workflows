name: PnP processor - test, lint and build image

on:
  workflow_call:
    secrets:
      SECRET_AUTH:
        required: true
      GCLOUD_AUTH_STAGING:
        required: true          
    inputs:
      GCR_image_name:
        description: 'A name of the image to be created in GCR'
        required: true
        type: string
      path-to-pom:
        description: 'Path to the pom file, relative to the repository root (e.g. my-service/pom.xml when working-directory is my-service).'
        required: true
        type: string
      path-to-dockerfile:
        description: 'Path to the Dockerfile, relative to the repository root. The docker build context is working-directory.'
        required: true
        type: string
      slack-channel:
        description: 'A slack channel which needs to be notified in case of failure'
        required: false
        type: string
      pact-application-id:
        required: false
        type: string
      pact-webhook-id:
        required: false
        type: string        
      jdk-distribution:
        description: 'JDK Distribution name'
        type: string
        required: false
        default: 'temurin'
      java-version:
        description: 'Java version used in the project'
        type: string
        required: false
        default: '21'
      use-old-setup-java:
        description: 'If true uses the java setup step of version 1'
        type: boolean
        required: false
        default: false
      do-pact-consumer-tests:
        description: 'If true runs tests defining data contracts'
        type: boolean
        required: false
        default: false
      do-pact-provider-tests:
        description: 'If true runs tests verifying implementation against data-contracts'
        type: boolean
        required: false
        default: false
      is-pact-consumer-can-i-deploy-dry-run:
        description: 'If true, consumer can-i-deploy step will be executed in dry-run mode'
        type: boolean
        required: false
        default: false
      is-pact-provider-can-i-deploy-dry-run:
        description: 'If true, provider can-i-deploy step will be executed in dry-run mode'
        type: boolean
        required: false
        default: false
      native-image:
        description: 'If true uses the GraalVm to compile app'
        type: boolean
        required: false
        default: false
      enable-kafka-streams-lint:
        description: 'If true runs Kafka Streams Lint'
        type: boolean
        required: false
        default: true
      working-directory:
        description: 'Directory of the Maven project, for repositories with several services. Defaults to the repository root.'
        required: false
        type: string
        default: ''
      path-to-pact-tests:
        description: 'Path to pact test directory, relative to working-directory.'
        type: string
        required: false
        default: 'target/pacts'
      tag-prefix:
        description: 'Release tag prefix. Must be provided in case of multiple projects in the same repository. Each project needs to have its own prefix. Use {service-prefix}-v format.'
        type: string
        required: false
        default: 'v'
      enable-changes-check:
        description: >-
          If true, test, lint and image only run when the changes require a build (see
          composite-actions/pr-changes-check). Only enable it when every job after this workflow
          also follows the action / build / redeploy outputs: a release or deploy job that runs
          after a skipped image fails, because no image was pushed for the commit. Always safe on
          pull requests, which never release. If false, every run is a full build.
        type: boolean
        required: false
        default: false
    outputs:
      action:
        description: "What the changes require: 'build' (jar + image + deploy), 'redeploy' (deploy the current release image with changed service definitions) or 'none'"
        value: ${{ jobs.changes.outputs.action }}
      build:
        description: "'true' when the jar and image were rebuilt"
        value: ${{ jobs.changes.outputs.build }}
      redeploy:
        description: "'true' when an autopilot/cloud-deploy service definition changed"
        value: ${{ jobs.changes.outputs.redeploy }}

# Tool versions used by this workflow, in one place. Action versions (uses: ...@vN) cannot be
# set from variables and stay pinned in the steps.
env:
  # org.sonarsource.scanner.maven:sonar-maven-plugin
  SONAR_MAVEN_PLUGIN_VERSION: '5.8.0.7211'
  # GraalVM release used by graalvm/setup-graalvm for native images
  GRAALVM_VERSION: 'latest'

# Build stage shared by all PnP processor pipelines (also called by pnp-build-autopilot-processor.yml).
#
#   changes ─> test ─┐
#          └─> lint ─┴─> image (master only)
#                    └─> build (status check, needs changes + test + lint)
#
# 0. changes If enable-changes-check: composite-actions/pr-changes-check decides from the changed
#           files whether the jar and image must be rebuilt. Pull requests and pushes to other
#           branches are compared with the default branch; a push to the default branch with
#           its previous tip. Any other event, or a failed check, falls back to a full build. test, lint and image only
#           run when build is true; the decision is exposed as the action / build / redeploy
#           outputs. If enable-changes-check is false (default), every run is a full build.
# 1. test   Determine version, Maven verify in working-directory (compile, tests, coverage,
#           jar named with the version), then Sonar analysis on that build (quality gate).
#           Publish pacts and run can-i-deploy (if enabled). On master, upload the jar.
# 2. lint   Runs in parallel with test (if enable-kafka-streams-lint):
#           compile, then Kafka Streams Detekt rules.
# 3. image  Master only, after test and lint passed (lint may be disabled):
#           JVM: download the tested jar from the test job (no rebuild).
#           Native: compile the native image with GraalVM, without tests.
#           Then docker build and push
#           (tags: version, commit sha, latest), Trivy scan, Binary Authorization attestation.
#
# On non-master branches a newer push cancels the running jobs; master runs are never cancelled.
# Any failure on master is reported to slack-channel.

jobs:
  # Decides whether the changes require a build (jar + image), a redeploy or nothing.
  # Always a full build when enable-changes-check is false or the check cannot run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      build: ${{ steps.decide.outputs.build }}
      redeploy: ${{ steps.decide.outputs.redeploy }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.enable-changes-check == true }}
        with:
          fetch-depth: 0

      # Commits to compare. Empty when the event has no usable base, which forces a full build.
      - name: Determine commits to compare
        id: commits
        if: ${{ inputs.enable-changes-check == true }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BASE="" HEAD=""
          case "$EVENT_NAME" in
            pull_request|pull_request_target)
              BASE="$PR_BASE"; HEAD="$PR_HEAD" ;;
            push)
              HEAD="$GITHUB_SHA"
              if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
                # The commits in this push. Empty when there is no previous tip (all zeros).
                [[ "$PUSH_BEFORE" =~ ^0*$ ]] || BASE="$PUSH_BEFORE"
              elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
                # Like a pull request: the whole branch against the default branch. Comparing
                # only this push would let a docs-only push pass after a push with failing tests.
                BASE=$(git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH") || BASE=""
              fi ;;
          esac
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Check changes
        id: check
        if: ${{ steps.commits.outputs.base != '' && steps.commits.outputs.head != '' }}
        continue-on-error: true
        uses: extenda/shared-workflows/composite-actions/pr-changes-check@master
        with:
          base-sha: ${{ steps.commits.outputs.base }}
          head-sha: ${{ steps.commits.outputs.head }}

      # Full build when the check is disabled, or falls back to one when it was skipped or failed.
      - name: Decide
        id: decide
        env:
          ENABLED: ${{ inputs.enable-changes-check }}
          OUTCOME: ${{ steps.check.outcome }}
          ACTION: ${{ steps.check.outputs.action }}
          BUILD: ${{ steps.check.outputs.build }}
          REDEPLOY: ${{ steps.check.outputs.redeploy }}
        run: |
          if [[ "$ENABLED" != "true" ]]; then
            echo "Changes check disabled (enable-changes-check is false), full build"
            ACTION=build BUILD=true REDEPLOY=true
          elif [[ "$OUTCOME" != "success" ]]; then
            if [[ "$OUTCOME" == "skipped" ]]; then
              REASON="The $GITHUB_EVENT_NAME event has no commit to compare with."
            else
              REASON="The changes check failed, see the Check changes step."
            fi
            echo "::notice title=Changes check: build (fallback)::Full build without checking the changes. $REASON"
            {
              echo "## Changes check: \`build\` (fallback)"
              echo
              echo "**Decision:** Full build, release and deploy, without checking the changes."
              echo
              echo "**Why:** $REASON A full build is always safe."
            } >> "$GITHUB_STEP_SUMMARY"
            ACTION=build BUILD=true REDEPLOY=true
          fi
          echo "action=$ACTION build=$BUILD redeploy=$REDEPLOY"
          {
            echo "action=$ACTION"
            echo "build=$BUILD"
            echo "redeploy=$REDEPLOY"
          } >> "$GITHUB_OUTPUT"

  # Determines the version, compiles, tests and packages the jar, runs Sonar analysis,
  # publishes pacts and runs can-i-deploy. On master, uploads the jar for the image job.
  test:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.GCR_image_name }}-test
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    outputs:
      version: ${{ steps.semver.outputs.version }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: extenda/actions/gcp-secret-manager@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}
          secrets: |
            GITHUB-TOKEN: github-token
            NEXUS_PASSWORD: nexus-password
            NEXUS_USERNAME: nexus-username

      - name: Setup gcloud
        uses: extenda/actions/setup-gcloud@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}

      - name: Set up JDK
        if: ${{ inputs.use-old-setup-java == false }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Set up JDK
        if: ${{ inputs.use-old-setup-java == true }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.java-version }}

      - uses: actions/cache@v4
        if: ${{ inputs.use-old-setup-java == true }}
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Determine version
        uses: extenda/actions/conventional-version@v0
        id: semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-prefix: ${{ inputs.tag-prefix }}
          build-number: ${{ github.run_number }}

      # Compile, test and package with the release version set in the POM, so the jar is named
      # <artifactId>-<version>.jar as the Dockerfile expects.
      - name: Verify with Maven
        uses: extenda/actions/maven@v0
        with:
          args: verify -ntp -s settings.xml
          version: ${{ steps.semver.outputs.version }}
          service-account-key: ${{ secrets.SECRET_AUTH }}
          working-directory: ${{ inputs.working-directory || '.' }}

      # Analysis only: reuses the classes and coverage report from the verify step, no recompile or tests.
      - name: Analyze with Sonar
        uses: extenda/actions/sonar-scanner@v0
        with:
          sonar-host: https://sonarcloud.io
          # The Sonar action runs Maven from the repository root, so paths are root-relative.
          # skipJreProvisioning: analyze with the job's JDK instead of downloading a JRE on every run.
          maven-args: --file ${{ inputs.path-to-pom }} --settings ${{ inputs.working-directory || '.' }}/settings.xml -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:${{ env.SONAR_MAVEN_PLUGIN_VERSION }}:sonar -Dsonar.scanner.skipJreProvisioning=true -Dsonar.projectVersion=${{ steps.semver.outputs.version }}
          service-account-key: ${{ secrets.SECRET_AUTH }}
          working-directory: ${{ inputs.working-directory || '.' }}

      # The image job builds the docker image from this tested jar instead of rebuilding it.
      - name: Upload jar
        if: ${{ github.ref == 'refs/heads/master' && inputs.native-image == false }}
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ inputs.GCR_image_name }}
          path: ${{ inputs.working-directory || '.' }}/target/*.jar
          if-no-files-found: error
          retention-days: 1
          # A jar is already zip-compressed.
          compression-level: 0

      - name: Publish pacts
        if: ${{ inputs.do-pact-consumer-tests == true }}
        uses: extenda/actions/pact-publish@v0
        with:
          pacts-directory: ${{ inputs.working-directory || '.' }}/${{ inputs.path-to-pact-tests }}
          service-account-key: ${{ secrets.SECRET_AUTH }}

      - name: Can i deploy - consumer?
        if: ${{ inputs.do-pact-consumer-tests == true }}
        uses: extenda/actions/pact-can-i-deploy@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}
          application-name: ${{ inputs.pact-application-id }}
          retry-while-unknown: 15
          retry-interval: 10
          dry-run: ${{ inputs.is-pact-consumer-can-i-deploy-dry-run }}
          env: "staging"

      - name: Can i deploy - provider?
        if: ${{ inputs.do-pact-provider-tests == true }}
        uses: extenda/actions/pact-can-i-deploy@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}
          application-name: ${{ inputs.pact-application-id }}
          retry-while-unknown: 15
          retry-interval: 10
          dry-run: ${{ inputs.is-pact-provider-can-i-deploy-dry-run }}
          env: "staging"

      - name: Notify Slack if failed
        if: ${{ failure() && github.ref == 'refs/heads/master' }}
        uses: extenda/actions/slack-notify@v0
        with:
          text: |
            *Build failed for ${{ github.repository }}: ${{ github.workflow }}* :heavy_exclamation_mark:
            Build failed on ${{ github.event_name }} event. Workflow: ${{ github.workflow }}. Job: ${{github.job}}. Run id: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>
          channel: ${{ inputs.slack-channel }}
          service-account-key: ${{ secrets.SECRET_AUTH }}

  # Compiles and runs the Kafka Streams Detekt rules, in parallel with test.
  lint:
    needs: changes
    if: ${{ inputs.enable-kafka-streams-lint == true && needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.GCR_image_name }}-lint
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Shallow clone: lint needs neither the version nor the git history.
      - uses: actions/checkout@v4

      - uses: extenda/actions/gcp-secret-manager@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}
          secrets: |
            GITHUB-TOKEN: github-token
            NEXUS_PASSWORD: nexus-password
            NEXUS_USERNAME: nexus-username

      - name: Setup gcloud
        uses: extenda/actions/setup-gcloud@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}

      - name: Set up JDK
        if: ${{ inputs.use-old-setup-java == false }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Set up JDK
        if: ${{ inputs.use-old-setup-java == true }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.java-version }}

      - uses: actions/cache@v4
        if: ${{ inputs.use-old-setup-java == true }}
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile with Maven
        uses: extenda/actions/maven@v0
        with:
          args: compile -ntp -s settings.xml
          service-account-key: ${{ secrets.SECRET_AUTH }}
          working-directory: ${{ inputs.working-directory || '.' }}

      - name: Kafka Streams lint
        uses: extenda/shared-workflows/composite-actions/kafka-streams-lint@master
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ inputs.working-directory || '.' }}

      - name: Notify Slack if failed
        if: ${{ failure() && github.ref == 'refs/heads/master' }}
        uses: extenda/actions/slack-notify@v0
        with:
          text: |
            *Build failed for ${{ github.repository }}: ${{ github.workflow }}* :heavy_exclamation_mark:
            Build failed on ${{ github.event_name }} event. Workflow: ${{ github.workflow }}. Job: ${{github.job}}. Run id: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>
          channel: ${{ inputs.slack-channel }}
          service-account-key: ${{ secrets.SECRET_AUTH }}

  # Required status check: keeps the check name "<caller job> / build" that branch protection
  # expects. Passes when the changes check succeeded and test and lint succeeded or were skipped.
  build:
    if: always()
    needs: [changes, test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]

  # Master only: builds the docker image from the tested jar (or compiles a native image),
  # pushes it, scans it with Trivy and attests it for Binary Authorization.
  # Runs only after test passed and lint passed or was disabled.
  image:
    if: ${{ always() && github.ref == 'refs/heads/master' && needs.test.result == 'success' && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    needs: [test, lint]
    runs-on: ubuntu-latest
    # Native compilation with GraalVM takes much longer than a JVM image build.
    timeout-minutes: ${{ inputs.native-image && 60 || 20 }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.GCR_image_name }}-image
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # JVM image: reuse the jar built and tested in the test job.
      - name: Download jar
        if: ${{ inputs.native-image == false }}
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ inputs.GCR_image_name }}
          path: ${{ inputs.working-directory || '.' }}/target

      # Native image: compile with GraalVM (the jar cannot be reused for this).
      - uses: extenda/actions/gcp-secret-manager@v0
        if: ${{ inputs.native-image == true }}
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}
          secrets: |
            GITHUB-TOKEN: github-token
            NEXUS_PASSWORD: nexus-password
            NEXUS_USERNAME: nexus-username

      - name: Setup gcloud
        if: ${{ inputs.native-image == true }}
        uses: extenda/actions/setup-gcloud@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}

      - name: Set up JDK
        if: ${{ inputs.native-image == true && inputs.use-old-setup-java == false }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Set up JDK
        if: ${{ inputs.native-image == true && inputs.use-old-setup-java == true }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.java-version }}

      - uses: actions/cache@v4
        if: ${{ inputs.native-image == true && inputs.use-old-setup-java == true }}
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - uses: graalvm/setup-graalvm@v1
        if: ${{ inputs.native-image == true }}
        with:
          version: ${{ env.GRAALVM_VERSION }}
          java-version: ${{ inputs.java-version }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Tests run in the test job, so skip them here.
      - name: Package Native image with maven
        if: ${{ inputs.native-image == true }}
        uses: extenda/actions/maven@v0
        with:
          args: package -ntp -Dpackaging=native-image -DskipTests -s settings.xml
          version: ${{ needs.test.outputs.version }}
          service-account-key: ${{ secrets.SECRET_AUTH }}
          working-directory: ${{ inputs.working-directory || '.' }}

      - name: Setup gcloud for docker
        uses: extenda/actions/setup-gcloud@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}

      - name: Authenticate docker
        run: |
          gcloud --quiet auth configure-docker

      - name: Docker build and push
        run: |
          IMAGE=eu.gcr.io/extenda/${{ inputs.GCR_image_name }}
          docker build "./${{ inputs.working-directory || '.' }}" -f ${{ inputs.path-to-dockerfile }} --build-arg jar_version=${{ needs.test.outputs.version }} -t $IMAGE:${{ needs.test.outputs.version }} -t $IMAGE:${{ github.sha }} -t $IMAGE:latest
          docker push --all-tags $IMAGE

      - name: Scan image with Trivy
        uses: extenda/actions/trivy-scan@v0
        with:
          image: eu.gcr.io/extenda/${{ inputs.GCR_image_name }}:${{ needs.test.outputs.version }}
          service-account-key: ${{ secrets.GCLOUD_AUTH_STAGING }}
          # Only report HIGH and CRITICAL vulnerabilities
          severity: 'HIGH,CRITICAL'
          # Fail the build if vulnerabilities are found
          fail-on-vulnerabilities: false
          notify-slack-on-vulnerabilities: true
          upload-sbom: false

      - name: Attest image
        uses: extenda/actions/binary-auth-attestation@v0
        with:
          image-path: eu.gcr.io/extenda/${{ inputs.GCR_image_name }}
          service-account-key: ${{ secrets.GCLOUD_AUTH_STAGING }}

      - name: Notify Slack if failed
        if: ${{ failure() && github.ref == 'refs/heads/master' }}
        uses: extenda/actions/slack-notify@v0
        with:
          text: |
            *Build failed for ${{ github.repository }}: ${{ github.workflow }}* :heavy_exclamation_mark:
            Build failed on ${{ github.event_name }} event. Workflow: ${{ github.workflow }}. Job: ${{github.job}}. Run id: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>
          channel: ${{ inputs.slack-channel }}
          service-account-key: ${{ secrets.SECRET_AUTH }}
