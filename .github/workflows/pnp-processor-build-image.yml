name: test and build docker image

on:
  workflow_call:
    secrets:
      SECRET_AUTH:
        required: true
      GCLOUD_AUTH_STAGING:
        required: true          
    inputs:
      GCR_image_name:
        description: 'A name of the image to be created in GCR'
        required: true
        type: string
      path-to-pom:
        description: 'Path to the pom file. When working directory is set, this path is relative to it.'
        required: true
        type: string
      path-to-dockerfile:
        description: 'Path to dockerfile which builds the service. When working directory is set, this path is relative to it.'
        required: true
        type: string
      slack-channel:
        description: 'A slack channel which needs to be notified in case of failure'
        required: false
        type: string
      pact-application-id:
        required: false
        type: string
      pact-webhook-id:
        required: false
        type: string        
      jdk-distribution:
        description: 'JDK Distribution name'
        type: string
        required: false
        default: 'temurin'
      java-version:
        description: 'Java version used in the project'
        type: string
        required: false
        default: '21'
      use-old-setup-java:
        description: 'If true uses the java setup step of version 1'
        type: boolean
        required: false
        default: false
      do-pact-consumer-tests:
        description: 'If true runs tests defining data contracts'
        type: boolean
        required: false
        default: false
      do-pact-provider-tests:
        description: 'If true runs tests verifying implementation against data-contracts'
        type: boolean
        required: false
        default: false
      is-pact-consumer-can-i-deploy-dry-run:
        description: 'If true, consumer can-i-deploy step will be executed in dry-run mode'
        type: boolean
        required: false
        default: false
      is-pact-provider-can-i-deploy-dry-run:
        description: 'If true, provider can-i-deploy step will be executed in dry-run mode'
        type: boolean
        required: false
        default: false
      native-image:
        description: 'If true uses the GraalVm to compile app'
        type: boolean
        required: false
        default: false
      enable-kafka-streams-lint:
        description: 'If true runs Kafka Streams Lint'
        type: boolean
        required: false
        default: true
      working-directory:
        description: 'Directory of the Maven project, for repositories with several services. Defaults to the repository root.'
        required: false
        type: string
        default: ''
      path-to-pact-tests:
        description: 'Path to pact test directory, relative to working-directory.'
        type: string
        required: false
        default: 'target/pacts'
      tag-prefix:
        description: 'Release tag prefix. Must be provided in case of multiple projects in the same repository. Each project needs to have its own prefix. Use {service-prefix}-v format.'
        type: string
        required: false
        default: 'v'

# Build stage shared by all PnP processor pipelines (also called by pnp-build-autopilot-processor.yml).
#
#   test ─┐
#   lint ─┴─> image (master only)
#
# 1. test   Determine version, then one Maven run in working-directory:
#           compile, unit/integration tests, coverage and Sonar analysis (quality gate).
#           Publish pacts and run can-i-deploy for consumer/provider (if pact tests enabled).
# 2. lint   Runs in parallel with test (if enable-kafka-streams-lint):
#           compile, then Kafka Streams Detekt rules.
# 3. image  Master only, after test and lint passed (lint may be disabled):
#           package the jar or native image without tests, docker build and push
#           (tags: version, commit sha, latest), Trivy scan, Binary Authorization attestation.
#
# On non-master branches a newer push cancels the running jobs; master runs are never cancelled.
# Any failure on master is reported to slack-channel.

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.GCR_image_name }}-test
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: extenda/actions/gcp-secret-manager@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}
          secrets: |
            GITHUB-TOKEN: github-token
            NEXUS_PASSWORD: nexus-password
            NEXUS_USERNAME: nexus-username

      - name: Setup gcloud
        uses: extenda/actions/setup-gcloud@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}

      - name: Set up JDK
        if: ${{ inputs.use-old-setup-java == false }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Set up JDK
        if: ${{ inputs.use-old-setup-java == true }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.java-version }}

      - uses: actions/cache@v4
        if: ${{ inputs.use-old-setup-java == true }}
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Determine version
        uses: extenda/actions/conventional-version@v0
        id: semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-prefix: ${{ inputs.tag-prefix }}
          build-number: ${{ github.run_number }}

      # path-to-pom is relative to the repository root; Sonar runs in the project directory.
      - name: Resolve pom path
        id: paths
        env:
          WORKING_DIR: ${{ inputs.working-directory || '.' }}
          PATH_TO_POM: ${{ inputs.path-to-pom }}
        run: echo "pom=$(realpath -m --relative-to="$WORKING_DIR" "$PATH_TO_POM")" >> "$GITHUB_OUTPUT"

      # One Maven run: compile, tests, coverage and Sonar analysis together.
      - name: Verify and analyze with Sonar
        uses: extenda/actions/sonar-scanner@v0
        with:
          sonar-host: https://sonarcloud.io
          maven-args: --file ${{ steps.paths.outputs.pom }} --settings settings.xml verify org.sonarsource.scanner.maven:sonar-maven-plugin:3.7.0.1746:sonar -Dsonar.projectVersion=${{ steps.semver.outputs.version }}
          service-account-key: ${{ secrets.SECRET_AUTH }}
          working-directory: ${{ inputs.working-directory || '.' }}

      - name: Publish pacts
        if: ${{ inputs.do-pact-consumer-tests == true }}
        uses: extenda/actions/pact-publish@v0
        with:
          pacts-directory: ${{ inputs.working-directory || '.' }}/${{ inputs.path-to-pact-tests }}
          service-account-key: ${{ secrets.SECRET_AUTH }}

      - name: Can i deploy - consumer?
        if: ${{ inputs.do-pact-consumer-tests == true }}
        uses: extenda/actions/pact-can-i-deploy@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}
          application-name: ${{ inputs.pact-application-id }}
          retry-while-unknown: 15
          retry-interval: 10
          dry-run: ${{ inputs.is-pact-consumer-can-i-deploy-dry-run }}
          env: "staging"

      - name: Can i deploy - provider?
        if: ${{ inputs.do-pact-provider-tests == true }}
        uses: extenda/actions/pact-can-i-deploy@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}
          application-name: ${{ inputs.pact-application-id }}
          retry-while-unknown: 15
          retry-interval: 10
          dry-run: ${{ inputs.is-pact-provider-can-i-deploy-dry-run }}
          env: "staging"

      - name: Notify Slack if failed
        if: ${{ failure() && github.ref == 'refs/heads/master' }}
        uses: extenda/actions/slack-notify@v0
        with:
          text: |
            *Build failed for ${{ github.repository }}: ${{ github.workflow }}* :heavy_exclamation_mark:
            Build failed on ${{ github.event_name }} event. Workflow: ${{ github.workflow }}. Job: ${{github.job}}. Run id: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>
          channel: ${{ inputs.slack-channel }}
          service-account-key: ${{ secrets.SECRET_AUTH }}

  lint:
    if: ${{ inputs.enable-kafka-streams-lint == true }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.GCR_image_name }}-lint
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: extenda/actions/gcp-secret-manager@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}
          secrets: |
            GITHUB-TOKEN: github-token
            NEXUS_PASSWORD: nexus-password
            NEXUS_USERNAME: nexus-username

      - name: Setup gcloud
        uses: extenda/actions/setup-gcloud@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}

      - name: Set up JDK
        if: ${{ inputs.use-old-setup-java == false }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Set up JDK
        if: ${{ inputs.use-old-setup-java == true }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.java-version }}

      - uses: actions/cache@v4
        if: ${{ inputs.use-old-setup-java == true }}
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Determine version
        uses: extenda/actions/conventional-version@v0
        id: semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-prefix: ${{ inputs.tag-prefix }}
          build-number: ${{ github.run_number }}

      - name: Compile with Maven
        uses: extenda/actions/maven@v0
        with:
          args: compile -s settings.xml
          version: ${{ steps.semver.outputs.version }}
          service-account-key: ${{ secrets.SECRET_AUTH }}
          working-directory: ${{ inputs.working-directory || '.' }}

      - name: Kafka Streams lint
        uses: extenda/shared-workflows/composite-actions/kafka-streams-lint@master
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ inputs.working-directory || '.' }}

      - name: Notify Slack if failed
        if: ${{ failure() && github.ref == 'refs/heads/master' }}
        uses: extenda/actions/slack-notify@v0
        with:
          text: |
            *Build failed for ${{ github.repository }}: ${{ github.workflow }}* :heavy_exclamation_mark:
            Build failed on ${{ github.event_name }} event. Workflow: ${{ github.workflow }}. Job: ${{github.job}}. Run id: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>
          channel: ${{ inputs.slack-channel }}
          service-account-key: ${{ secrets.SECRET_AUTH }}

  image:
    # Build only after tests passed and lint passed or was disabled.
    if: ${{ always() && github.ref == 'refs/heads/master' && needs.test.result == 'success' && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    needs: [test, lint]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.GCR_image_name }}-image
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: extenda/actions/gcp-secret-manager@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}
          secrets: |
            GITHUB-TOKEN: github-token
            NEXUS_PASSWORD: nexus-password
            NEXUS_USERNAME: nexus-username

      - name: Setup gcloud
        uses: extenda/actions/setup-gcloud@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}

      - name: Set up JDK
        if: ${{ inputs.use-old-setup-java == false }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Set up JDK
        if: ${{ inputs.use-old-setup-java == true }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.java-version }}

      - uses: actions/cache@v4
        if: ${{ inputs.use-old-setup-java == true }}
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Determine version
        uses: extenda/actions/conventional-version@v0
        id: semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-prefix: ${{ inputs.tag-prefix }}
          build-number: ${{ github.run_number }}

      - uses: graalvm/setup-graalvm@v1
        if: ${{ inputs.native-image == true }}
        with:
          version: 'latest'
          java-version: ${{ inputs.java-version }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Tests run in the test job, so skip them here.
      - name: Package with Maven
        if: ${{ inputs.native-image == false }}
        uses: extenda/actions/maven@v0
        with:
          args: package -DskipTests -s settings.xml
          version: ${{ steps.semver.outputs.version }}
          service-account-key: ${{ secrets.SECRET_AUTH }}
          working-directory: ${{ inputs.working-directory || '.' }}

      - name: Package Native image with maven
        if: ${{ inputs.native-image == true }}
        uses: extenda/actions/maven@v0
        with:
          args: package -Dpackaging=native-image -DskipTests -s settings.xml
          version: ${{ steps.semver.outputs.version }}
          service-account-key: ${{ secrets.SECRET_AUTH }}
          working-directory: ${{ inputs.working-directory || '.' }}

      - name: Setup gcloud for docker
        uses: extenda/actions/setup-gcloud@v0
        with:
          service-account-key: ${{ secrets.SECRET_AUTH }}

      - name: Authenticate docker
        run: |
          gcloud --quiet auth configure-docker

      - name: Docker build and push
        run: |
          IMAGE=eu.gcr.io/extenda/${{ inputs.GCR_image_name }}
          docker build "./${{ inputs.working-directory || '.' }}" -f ${{ inputs.path-to-dockerfile }} --build-arg jar_version=${{ steps.semver.outputs.version }} -t $IMAGE:${{ steps.semver.outputs.version }} -t $IMAGE:${{ github.sha }} -t $IMAGE:latest
          docker push --all-tags $IMAGE

      - name: Scan image with Trivy
        uses: extenda/actions/trivy-scan@v0
        with:
          image: eu.gcr.io/extenda/${{ inputs.GCR_image_name }}:${{ steps.semver.outputs.version }}
          service-account-key: ${{ secrets.GCLOUD_AUTH_STAGING }}
          # Only report HIGH and CRITICAL vulnerabilities
          severity: 'HIGH,CRITICAL'
          # Fail the build if vulnerabilities are found
          fail-on-vulnerabilities: false
          notify-slack-on-vulnerabilities: true
          upload-sbom: false

      - name: Attest image
        uses: extenda/actions/binary-auth-attestation@v0
        with:
          image-path: eu.gcr.io/extenda/${{ inputs.GCR_image_name }}
          service-account-key: ${{ secrets.GCLOUD_AUTH_STAGING }}

      - name: Notify Slack if failed
        if: ${{ failure() && github.ref == 'refs/heads/master' }}
        uses: extenda/actions/slack-notify@v0
        with:
          text: |
            *Build failed for ${{ github.repository }}: ${{ github.workflow }}* :heavy_exclamation_mark:
            Build failed on ${{ github.event_name }} event. Workflow: ${{ github.workflow }}. Job: ${{github.job}}. Run id: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>
          channel: ${{ inputs.slack-channel }}
          service-account-key: ${{ secrets.SECRET_AUTH }}
