name: PR Rebuild Check tests

on:
  pull_request:
    paths:
      - 'composite-actions/pr-rebuild-check/**'
      - '.github/workflows/pr-rebuild-check-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck composite-actions/pr-rebuild-check/*.sh

      - name: Run tests
        run: composite-actions/pr-rebuild-check/rebuild-check.test.sh

  run-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PR rebuild check
        id: check
        uses: ./composite-actions/pr-rebuild-check

      - name: Verify outputs
        env:
          REBUILD: ${{ steps.check.outputs.rebuild }}
          SERVICE_CONFIG_CHANGED: ${{ steps.check.outputs.service-config-changed }}
        run: |
          echo "rebuild=$REBUILD service-config-changed=$SERVICE_CONFIG_CHANGED"
          [[ "$REBUILD" =~ ^(true|false)$ && "$SERVICE_CONFIG_CHANGED" =~ ^(true|false)$ ]]
