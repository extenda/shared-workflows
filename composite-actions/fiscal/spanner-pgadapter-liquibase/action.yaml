name: 'Spanner (PG-dialect) Liquibase migration'
description: >-
  Run standard Postgres Liquibase against a PostgreSQL-dialect Cloud Spanner
  database by fronting it with PGAdapter. The PG-dialect counterpart to
  generic/cloud-sql-liquibase (which targets Cloud SQL) and a deliberate
  alternative to extenda/actions/liquibase-spanner (which is GoogleSQL dialect).

inputs:
  service-account-key:
    description: 'GCP service-account key (JSON) with access to the Spanner database.'
    required: true
  project:
    description: 'GCP project hosting the Spanner instance.'
    required: true
  instance:
    description: 'Spanner instance id.'
    required: false
    default: 'fiscal-signing'
  database:
    description: 'Spanner database id (must be PostgreSQL dialect).'
    required: true
  changelog-file:
    description: 'Liquibase changelog file, relative to search-path.'
    required: false
    default: 'changelog-master.yaml'
  search-path:
    description: 'Directory that contains the changelog (and its includes).'
    required: true
  pgadapter-image:
    description: >-
      PGAdapter image. Pinned by digest for immutability (Dependabot's docker ecosystem only
      scans Dockerfile/docker-compose.yml, not action.yaml inputs, so this is NOT auto-updated —
      check https://console.cloud.google.com/artifacts/docker/cloud-spanner-pg-adapter/us/gcr.io/pgadapter
      periodically and bump both the tag and digest together by hand.
    required: false
    default: 'gcr.io/cloud-spanner-pg-adapter/pgadapter:v0.55.0@sha256:30bb42ded681effccf83f93e5f5107c1ef9e5e48513d0f7e1d30c7bfc69fa5fa'
  liquibase-version:
    description: >-
      Liquibase version, used as the tag of the liquibase/liquibase base image the action
      builds from (see this action's Dockerfile). 5.x Community images ship no JDBC drivers,
      so the PostgreSQL driver is installed on top with LPM.
    required: false
    default: '5.0.3'
  postgres-driver-version:
    description: >-
      PostgreSQL JDBC driver version installed into the Liquibase image with LPM. Pinned to an
      exact version so rebuilds are reproducible. Which versions exist depends on the LPM index
      of the chosen liquibase-version (42.7.11 resolves on 5.0.3 but not on 5.0.2), so set this
      to '' to accept whatever driver that release offers.
    required: false
    default: '42.7.11'

runs:
  using: composite
  steps:
    # Authenticate via the trusted action. It writes the credential file, registers it for
    # log masking, and exports GOOGLE_APPLICATION_CREDENTIALS — so the key value is never
    # interpolated into a shell command or handled by this action directly.
    - uses: extenda/actions/setup-gcloud@v0
      with:
        service-account-key: ${{ inputs.service-account-key }}

    # Built (not pulled) because Liquibase 5.x ships no JDBC drivers — see the Dockerfile.
    # Built before PGAdapter starts so a build failure costs nothing to tear down.
    - name: Build Liquibase image
      shell: bash
      env:
        LIQUIBASE_VERSION: ${{ inputs.liquibase-version }}
        POSTGRES_DRIVER_VERSION: ${{ inputs.postgres-driver-version }}
      run: |
        set -euo pipefail
        docker build \
          --build-arg "LIQUIBASE_VERSION=${LIQUIBASE_VERSION}" \
          --build-arg "POSTGRES_DRIVER_VERSION=${POSTGRES_DRIVER_VERSION}" \
          -t liquibase-pg:local \
          "${{ github.action_path }}"

    - name: Start PGAdapter
      shell: bash
      run: |
        if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
          echo "GOOGLE_APPLICATION_CREDENTIALS not set; setup-gcloud must run first" >&2
          exit 1
        fi
        # Best-effort clean of any leftover container from a crashed prior run (a no-op on
        # ephemeral GitHub-hosted runners; guards reused/self-hosted runners against a name clash).
        docker rm -f pgadapter 2>/dev/null || true
        # Mount the credential DIRECTORY (not just the one file) at its original host path and
        # let PGAdapter pick up the credentials via Application Default Credentials. Under
        # Workload Identity Federation, GOOGLE_APPLICATION_CREDENTIALS is an external-account
        # config that references a SECOND file (the OIDC token) in the same job-scoped dir by
        # its absolute host path — so the dir must be mounted at that same path and the env var
        # passed through unchanged, otherwise PGAdapter fails with "UNAUTHENTICATED: Failed
        # computing credential metadata". A legacy self-contained JSON key also works this way.
        CRED_DIR="$(dirname "${GOOGLE_APPLICATION_CREDENTIALS}")"
        docker run -d --name pgadapter \
          -p 5432:5432 \
          -v "${CRED_DIR}:${CRED_DIR}:ro" \
          -e GOOGLE_APPLICATION_CREDENTIALS \
          "${{ inputs.pgadapter-image }}" \
          -p "${{ inputs.project }}" -i "${{ inputs.instance }}" -x
        # PGAdapter is the last thing to open the port; wait until it accepts TCP.
        for i in $(seq 1 30); do
          if (exec 3<>/dev/tcp/localhost/5432) 2>/dev/null; then echo "PGAdapter ready"; exit 0; fi
          sleep 1
        done
        echo "PGAdapter did not become ready" >&2
        docker logs pgadapter || true
        exit 1

    # Liquibase runs as a SELF-MANAGED container (not the liquibase-github-actions/update
    # container action, which the runner executes in an isolated network + filesystem
    # namespace where `localhost` is not the host and host paths are not mounted). Here this
    # action controls both:
    #   * --network host makes the container's localhost:5432 the runner's localhost, where
    #     PGAdapter published its port (-p 5432:5432) — so no URL change and no PGAdapter
    #     change are needed. (Linux-only semantics; correct on GitHub-hosted ubuntu-latest.)
    #   * the search-path dir is bind-mounted and referenced by a CONTAINER path.
    # Settings are passed as LIQUIBASE_* env vars (same convention as
    # extenda/actions/liquibase-spanner), so `update` is the only positional token and there
    # is no CLI arg-ordering ambiguity. JAVA_HOME is deliberately NOT forwarded, so the
    # runner's host JAVA_HOME cannot leak in and misdirect the launcher.
    # ddl_transaction_mode=AutocommitExplicitTransaction makes PGAdapter turn the transactional
    # DDL Liquibase emits into Spanner DDL batches (Spanner forbids DDL inside explicit
    # transactions). PGAdapter authenticates to Spanner via the mounted key, so the client-side
    # username/password are unused.
    - name: Run Liquibase update
      shell: bash
      env:
        SEARCH_PATH: ${{ inputs.search-path }}
        LIQUIBASE_COMMAND_CHANGELOG_FILE: ${{ inputs.changelog-file }}
        LIQUIBASE_COMMAND_URL: 'jdbc:postgresql://localhost:5432/${{ inputs.database }}?options=-c%20spanner.ddl_transaction_mode=AutocommitExplicitTransaction'
        LIQUIBASE_COMMAND_USERNAME: spanner
        LIQUIBASE_COMMAND_PASSWORD: spanner
        LIQUIBASE_SEARCH_PATH: /liquibase/changelog
      run: |
        set -euo pipefail
        # Absolute path required so `docker -v` treats it as a bind mount, not a named volume.
        SEARCH_PATH="$(realpath "${SEARCH_PATH}")"
        docker run --rm --network host \
          -v "${SEARCH_PATH}:/liquibase/changelog:ro" \
          -e LIQUIBASE_SEARCH_PATH \
          -e LIQUIBASE_COMMAND_CHANGELOG_FILE \
          -e LIQUIBASE_COMMAND_URL \
          -e LIQUIBASE_COMMAND_USERNAME \
          -e LIQUIBASE_COMMAND_PASSWORD \
          liquibase-pg:local \
          update

    - name: Stop PGAdapter
      if: always()
      shell: bash
      run: docker rm -f pgadapter || true
