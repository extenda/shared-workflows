name: k6 performance test
description: >
  Run a k6 performance test and report the summary to the SRE API, either as a Cloud Run
  Job inside the VPC (for a service not reachable from a GitHub runner) or directly on the
  runner (for one that is). See the runtime input.

inputs:
  runtime:
    description: >
      Where k6 runs. cloud-run-job (default) runs it as a Cloud Run Job inside the VPC --
      use this when the service under test is not reachable from a GitHub-hosted runner
      (internal-only, behind Cloud Armor, clan-network-only). github-actions runs k6
      directly on the runner -- simpler, but only works when the runner can reach
      target-host itself. mode, image, and the job-configuration inputs below only apply
      to cloud-run-job.
    required: false
    default: cloud-run-job
  mode:
    description: >
      cloud-run-job only. deploy (build the image and create or update the job), execute
      (run the existing job), or both.
    required: false
    default: both

  service-account-key:
    description: >
      GCP service account key used by the pipeline. For github-actions, also used to mint
      identity tokens as job-service-account.
    required: true
  project-id:
    description: GCP project the Cloud Run Job lives in, or that job-service-account belongs to.
    required: true
  region:
    description: cloud-run-job only. Region the Cloud Run Job lives in.
    required: false
    default: europe-west1
  job-name:
    description: cloud-run-job only. Name of the Cloud Run Job.
    required: false
    default: ''

  # --- Reported to the SRE API -------------------------------------------------------
  # These, with project-id, are the partition key behind GET /k6/trends. Changing any of
  # them starts a new series, so keep them stable once a test has history.
  service-name:
    description: Service under test, reported as X-Service-Name.
    required: true
  test-name:
    description: Name of this test, reported as X-Test-Name. Stable across runs.
    required: true
  environment:
    description: Environment the test ran against, reported as X-Environment.
    required: true
  clan:
    description: Owning clan, reported as X-Clan.
    required: true

  # --- Slack reporting (mode execute/both) -------------------------------------------
  slack-notify:
    description: >
      When to post the result to Slack: never, on-failure, or always. Reports only whether
      the execution succeeded or failed, so it needs slack-service-account-key.
    required: false
    default: never
  slack-channel:
    description: >
      Channel to post to. Leave empty to use the clan's monitoring channel, which
      extenda/actions/slack-notify resolves from the clan_slack_channel secret. A private
      channel needs the SlackNotifications app invited first.
    required: false
    default: ''
  slack-service-account-key:
    description: >
      Service account key for extenda/actions/slack-notify, which reads the Slack token
      from Secret Manager. Usually a different key from service-account-key.
    required: false
    default: ''

  # --- Image (cloud-run-job, mode deploy/both) ---------------------------------------
  image:
    description: Image repository to push to, without a tag.
    required: false
    default: ''
  image-tag:
    description: Tag for the image. Defaults to the commit SHA.
    required: false
    default: ''
  script-path:
    description: >
      Path to the k6 script, e.g. target/k6/my-test.js. Its directory is treated as the
      whole test's assets -- anything the script opens (payload files, protos) via a
      relative open() must live alongside it there. cloud-run-job copies that directory to
      /k6-tests in the image; github-actions runs k6 against it directly, so it must
      already exist in the runner's workspace (e.g. checked out, or generated by an
      earlier step).
    required: false
    default: ''
  k6-flags:
    description: >
      Extra flags appended to the k6 run command, e.g. '--vus 5 --duration 60s --rps 10'.
      Needed whenever load shape is not already set as options.scenarios in the script
      itself. Word-split on spaces, so a flag value cannot contain one.
    required: false
    default: ''
  k6-version:
    description: >
      Tag of the grafana/k6 base image. Because the Dockerfile is generated rather than
      checked in, dependabot cannot see this value -- it has to be bumped by hand when a
      new k6 is released.
    required: false
    default: 2.2.0
  extra-dockerfile-lines:
    description: >
      Extra Dockerfile instructions inserted before the assets are copied, for images
      that need more than curl. Rarely needed.
    required: false
    default: ''
  attest:
    description: cloud-run-job only. Attest the image for binary authorization.
    required: false
    default: 'true'

  # --- Service under test (both runtimes) --------------------------------------------
  target-host:
    description: >
      Host the k6 script targets, passed to the script as both TARGET_HOST and GRPC_HOST.
      For cloud-run-job this is usually only resolvable from inside the VPC; for
      github-actions it must be reachable from a GitHub-hosted runner.
    required: false
    default: ''
  target-authority:
    description: gRPC authority override, passed as GRPC_AUTHORITY. Optional.
    required: false
    default: ''
  target-audience:
    description: >
      Identity token audience for the service under test, passed to the script as
      AUTH_TOKEN. Leave empty for a service that needs no token.
    required: false
    default: ''

  # --- Job configuration (cloud-run-job, mode deploy/both) ---------------------------
  job-service-account:
    description: >
      cloud-run-job: the service account the job runs as. github-actions: the service
      account to impersonate when minting identity tokens (for target-audience and the
      SRE API upload). Either way it needs access to the service under test, and its
      project must be accepted by the SRE API.
    required: false
    default: ''
  network:
    description: VPC network the job attaches to.
    required: false
    default: clan-network
  subnet:
    description: Subnet the job attaches to.
    required: false
    default: cloudrun-subnet
  vpc-egress:
    description: >
      VPC egress setting. private-ranges-only keeps internal traffic on the VPC while
      letting the summary upload reach the SRE API directly.
    required: false
    default: private-ranges-only
  max-retries:
    description: >
      Retries for a failed task. Keep at 0: a retry replays the full load against the
      service under test and uploads a second summary.
    required: false
    default: '0'

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        RUNTIME: ${{ inputs.runtime }}
        MODE: ${{ inputs.mode }}
        IMAGE: ${{ inputs.image }}
        JOB_NAME: ${{ inputs.job-name }}
        SCRIPT_PATH: ${{ inputs.script-path }}
        TARGET_HOST: ${{ inputs.target-host }}
        JOB_SERVICE_ACCOUNT: ${{ inputs.job-service-account }}
        SLACK_NOTIFY: ${{ inputs.slack-notify }}
        SLACK_SERVICE_ACCOUNT_KEY: ${{ inputs.slack-service-account-key }}
      run: |
        set -uo pipefail
        fail=0
        require() {
          if [ -z "$2" ]; then
            echo "::error::input '$1' is required for this configuration"
            fail=1
          fi
        }
        require_script() {
          if [ -n "$SCRIPT_PATH" ] && [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::script-path '$SCRIPT_PATH' not found. Generate the k6 assets before this step."
            fail=1
          fi
        }

        case "$RUNTIME" in
          cloud-run-job|github-actions) ;;
          *) echo "::error::runtime must be cloud-run-job or github-actions, got '$RUNTIME'"; exit 1 ;;
        esac

        case "$MODE" in
          deploy|execute|both) ;;
          *) echo "::error::mode must be deploy, execute or both, got '$MODE'"; exit 1 ;;
        esac

        if [ "$RUNTIME" = github-actions ]; then
          # No deploy/execute split: every run needs the script and target right there.
          require script-path "$SCRIPT_PATH"
          require target-host "$TARGET_HOST"
          require job-service-account "$JOB_SERVICE_ACCOUNT"
          require_script
        else
          require job-name "$JOB_NAME"
          if [ "$MODE" != execute ]; then
            require image "$IMAGE"
            require script-path "$SCRIPT_PATH"
            require target-host "$TARGET_HOST"
            require job-service-account "$JOB_SERVICE_ACCOUNT"
            require_script
          fi
        fi

        case "$SLACK_NOTIFY" in
          never) ;;
          always|on-failure)
            if [ "$RUNTIME" = cloud-run-job ] && [ "$MODE" = deploy ]; then
              echo "::error::slack-notify has nothing to report in mode 'deploy'"
              fail=1
            fi
            require slack-service-account-key "$SLACK_SERVICE_ACCOUNT_KEY"
            ;;
          *) echo "::error::slack-notify must be never, on-failure or always, got '$SLACK_NOTIFY'"; fail=1 ;;
        esac

        exit $fail

    - name: Set up gcloud
      if: inputs.runtime == 'cloud-run-job'
      uses: extenda/actions/setup-gcloud@v0
      with:
        service-account-key: ${{ inputs.service-account-key }}

    - name: Build and push k6 image
      if: inputs.runtime == 'cloud-run-job' && inputs.mode != 'execute'
      id: build
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        IMAGE_TAG: ${{ inputs.image-tag || github.sha }}
        SCRIPT_PATH: ${{ inputs.script-path }}
        K6_VERSION: ${{ inputs.k6-version }}
        EXTRA_LINES: ${{ inputs.extra-dockerfile-lines }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # Everything alongside the script -- payload files, protos -- goes in too, since a
        # relative open() in the script expects them there.
        ASSETS_PATH="$(dirname "$SCRIPT_PATH")"

        # Build from a generated context so the entrypoint always comes from this action.
        # A per-repo Dockerfile would pin a copy of the upload logic that never gets fixed.
        BUILD_DIR="$(mktemp -d)"
        mkdir -p "$BUILD_DIR/assets"
        cp -R "$ASSETS_PATH/." "$BUILD_DIR/assets/"
        cp "$ACTION_PATH/entrypoint.sh" "$BUILD_DIR/entrypoint.sh"
        cp "$ACTION_PATH/upload-summary.sh" "$BUILD_DIR/upload-summary.sh"

        {
          echo "FROM grafana/k6:${K6_VERSION}"
          echo "USER root"
          echo "RUN apk add --no-cache curl"
          if [ -n "$EXTRA_LINES" ]; then echo "$EXTRA_LINES"; fi
          echo "COPY assets /k6-tests"
          echo "COPY entrypoint.sh /k6-tests/entrypoint.sh"
          echo "COPY upload-summary.sh /k6-tests/upload-summary.sh"
          echo "RUN chmod +x /k6-tests/entrypoint.sh /k6-tests/upload-summary.sh \\"
          echo " && adduser --disabled-password --gecos '' k6user \\"
          echo " && chown -R k6user:k6user /k6-tests"
          echo "USER k6user"
          echo "WORKDIR /k6-tests"
          echo 'ENTRYPOINT ["/k6-tests/entrypoint.sh"]'
        } > "$BUILD_DIR/Dockerfile"

        echo "Generated Dockerfile:"
        sed 's/^/  /' "$BUILD_DIR/Dockerfile"

        gcloud --quiet auth configure-docker "${IMAGE%%/*}"
        docker build -t "${IMAGE}:${IMAGE_TAG}" "$BUILD_DIR"
        docker push "${IMAGE}:${IMAGE_TAG}"

        echo "image=${IMAGE}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

    - name: Attest image
      if: inputs.runtime == 'cloud-run-job' && inputs.mode != 'execute' && inputs.attest == 'true'
      uses: extenda/actions/binary-auth-attestation@v0
      with:
        image-path: ${{ inputs.image }}
        service-account-key: ${{ inputs.service-account-key }}

    - name: Create or update Cloud Run Job
      if: inputs.runtime == 'cloud-run-job' && inputs.mode != 'execute'
      shell: bash
      env:
        IMAGE: ${{ steps.build.outputs.image }}
        JOB_NAME: ${{ inputs.job-name }}
        PROJECT_ID: ${{ inputs.project-id }}
        REGION: ${{ inputs.region }}
        NETWORK: ${{ inputs.network }}
        SUBNET: ${{ inputs.subnet }}
        VPC_EGRESS: ${{ inputs.vpc-egress }}
        JOB_SERVICE_ACCOUNT: ${{ inputs.job-service-account }}
        MAX_RETRIES: ${{ inputs.max-retries }}
        SERVICE_NAME: ${{ inputs.service-name }}
        TEST_NAME: ${{ inputs.test-name }}
        ENVIRONMENT: ${{ inputs.environment }}
        CLAN: ${{ inputs.clan }}
        SCRIPT_PATH: ${{ inputs.script-path }}
        K6_FLAGS: ${{ inputs.k6-flags }}
        TARGET_HOST: ${{ inputs.target-host }}
        TARGET_AUTHORITY: ${{ inputs.target-authority }}
        TARGET_AUDIENCE: ${{ inputs.target-audience }}
      run: |
        set -euo pipefail

        # After the build step copies script-path's directory to /k6-tests, the script
        # sits directly at /k6-tests/<basename>.
        SCRIPT="$(basename "$SCRIPT_PATH")"

        # Fixed rather than configurable: every caller so far has needed the same shape,
        # and a caller that genuinely needs more should be talking to us first.
        TASK_TIMEOUT=1h
        CPU=2
        MEMORY=1Gi
        SRE_API_URL=https://sre-api.retailsvc.com
        SRE_API_AUDIENCE=hiiretail-sre-api

        # '^@^' sets @ as the separator so values may contain commas.
        ENV_VARS="^@^SERVICE_NAME=${SERVICE_NAME}"
        ENV_VARS="${ENV_VARS}@PROJECT_ID=${PROJECT_ID}"
        ENV_VARS="${ENV_VARS}@TEST_NAME=${TEST_NAME}"
        ENV_VARS="${ENV_VARS}@ENVIRONMENT=${ENVIRONMENT}"
        ENV_VARS="${ENV_VARS}@CLAN=${CLAN}"
        ENV_VARS="${ENV_VARS}@K6_SCRIPT=${SCRIPT}"
        ENV_VARS="${ENV_VARS}@K6_FLAGS=${K6_FLAGS}"
        ENV_VARS="${ENV_VARS}@TARGET_HOST=${TARGET_HOST}"
        ENV_VARS="${ENV_VARS}@TARGET_AUTHORITY=${TARGET_AUTHORITY}"
        ENV_VARS="${ENV_VARS}@TARGET_AUDIENCE=${TARGET_AUDIENCE}"
        ENV_VARS="${ENV_VARS}@SRE_API_URL=${SRE_API_URL}"
        ENV_VARS="${ENV_VARS}@SRE_API_AUDIENCE=${SRE_API_AUDIENCE}"

        if gcloud run jobs describe "$JOB_NAME" --region "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
          echo "Job $JOB_NAME exists, updating it."
          VERB=update
        else
          echo "Job $JOB_NAME does not exist, creating it."
          VERB=create
        fi

        gcloud run jobs "$VERB" "$JOB_NAME" \
          --image "$IMAGE" \
          --region "$REGION" \
          --project "$PROJECT_ID" \
          --network "$NETWORK" \
          --subnet "$SUBNET" \
          --vpc-egress "$VPC_EGRESS" \
          --service-account "$JOB_SERVICE_ACCOUNT" \
          --task-timeout "$TASK_TIMEOUT" \
          --cpu "$CPU" \
          --memory "$MEMORY" \
          --max-retries "$MAX_RETRIES" \
          --set-env-vars "$ENV_VARS" \
          --quiet

    - name: Execute Cloud Run Job
      if: inputs.runtime == 'cloud-run-job' && inputs.mode != 'deploy'
      id: execute
      # Continues past a failed execution so the notification steps below still run -- a
      # failed run is exactly when a notification matters most. "Fail if run failed"
      # restores the failure once notification is done.
      continue-on-error: true
      shell: bash
      env:
        JOB_NAME: ${{ inputs.job-name }}
        PROJECT_ID: ${{ inputs.project-id }}
        REGION: ${{ inputs.region }}
      run: |
        set -uo pipefail

        # Logging only -- matches the fixed value the deploy step wrote onto the job.
        SRE_API_URL=https://sre-api.retailsvc.com

        # --wait blocks until the execution finishes and exits non-zero if it failed, so a
        # k6 threshold breach fails this step. The execution name comes back from the same
        # call; listing executions afterwards would race with concurrent runs.
        #
        # -e is off here so a non-zero exit still lets this record EXECUTION_ID and log
        # before propagating the failure via the explicit exit below.
        EXECUTION_ID="$(gcloud run jobs execute "$JOB_NAME" \
          --region "$REGION" \
          --project "$PROJECT_ID" \
          --wait \
          --quiet \
          --format='value(metadata.name)')"
        STATUS=$?

        echo "EXECUTION_ID=$EXECUTION_ID" >> "$GITHUB_ENV"
        if [ "$STATUS" -eq 0 ]; then
          echo "Execution $EXECUTION_ID finished. The job uploaded its summary to ${SRE_API_URL}."
        else
          echo "Execution $EXECUTION_ID failed. The job may still have uploaded its summary to ${SRE_API_URL}."
        fi
        exit "$STATUS"

    # --- github-actions runtime ---------------------------------------------------------
    # No image, no job, no VPC: k6 runs directly on the runner against target-host, which
    # must be reachable from here. The steps below must stay in this order -- the target
    # token step and the SRE API token step both set the job-scoped IDENTITY_TOKEN env var
    # (extenda/actions/identity-token's own convention), and each is consumed by the very
    # next step before the other one can overwrite it.
    - name: Set up k6
      if: inputs.runtime == 'github-actions'
      uses: grafana/setup-k6-action@v1

    - name: Get target identity token
      if: inputs.runtime == 'github-actions' && inputs.target-audience != ''
      uses: extenda/actions/identity-token@v0
      with:
        service-account-key: ${{ inputs.service-account-key }}
        service-account: ${{ inputs.job-service-account }}
        audiences: ${{ inputs.target-audience }}

    - name: Run k6
      if: inputs.runtime == 'github-actions'
      id: run-k6
      # Continues past a failed run for the same reason the Cloud Run Job execute step
      # does -- the notification steps below need to run, and "Fail if run failed" (at the
      # bottom) restores the failure once they have.
      continue-on-error: true
      shell: bash
      env:
        SCRIPT_PATH: ${{ inputs.script-path }}
        K6_FLAGS: ${{ inputs.k6-flags }}
        TARGET_HOST: ${{ inputs.target-host }}
        TARGET_AUTHORITY: ${{ inputs.target-authority }}
        AUTH_TOKEN: ${{ inputs.target-audience != '' && env.IDENTITY_TOKEN || '' }}
      run: |
        set -uo pipefail
        # $K6_FLAGS is deliberately unquoted -- see entrypoint.sh for why.
        # shellcheck disable=SC2086
        k6 run \
          --summary-export=summary.json \
          -e GRPC_HOST="${TARGET_HOST}" \
          -e TARGET_HOST="${TARGET_HOST}" \
          -e GRPC_AUTHORITY="${TARGET_AUTHORITY}" \
          -e AUTH_TOKEN="${AUTH_TOKEN}" \
          ${K6_FLAGS} \
          "${SCRIPT_PATH}"

    - name: Get SRE API token
      if: ${{ !cancelled() && inputs.runtime == 'github-actions' }}
      uses: extenda/actions/identity-token@v0
      with:
        service-account-key: ${{ inputs.service-account-key }}
        service-account: ${{ inputs.job-service-account }}
        audiences: hiiretail-sre-api

    - name: Upload k6 summary
      if: ${{ !cancelled() && inputs.runtime == 'github-actions' }}
      shell: bash
      env:
        SUMMARY_FILE: summary.json
        SRE_API_URL: https://sre-api.retailsvc.com
        SRE_TOKEN: ${{ env.IDENTITY_TOKEN }}
        SERVICE_NAME: ${{ inputs.service-name }}
        PROJECT_ID: ${{ inputs.project-id }}
        TEST_NAME: ${{ inputs.test-name }}
        ENVIRONMENT: ${{ inputs.environment }}
        CLAN: ${{ inputs.clan }}
      run: ${{ github.action_path }}/upload-summary.sh

    - name: Compose Slack message
      if: ${{ !cancelled() && inputs.slack-notify != 'never' && (inputs.runtime == 'github-actions' || inputs.mode != 'deploy') }}
      id: slack-message
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        TEST_NAME: ${{ inputs.test-name }}
        ENVIRONMENT: ${{ inputs.environment }}
        SLACK_NOTIFY: ${{ inputs.slack-notify }}
        OUTCOME: ${{ inputs.runtime == 'github-actions' && steps.run-k6.outcome || steps.execute.outcome }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -uo pipefail

        if [ "$SLACK_NOTIFY" = on-failure ] && [ "$OUTCOME" = success ]; then
          echo "notify=false" >> "$GITHUB_OUTPUT"
          echo "Run passed and slack-notify is on-failure; not posting."
          exit 0
        fi
        echo "notify=true" >> "$GITHUB_OUTPUT"

        if [ "$OUTCOME" = success ]; then
          HEADLINE=":white_check_mark: *${SERVICE_NAME}* k6 \`${TEST_NAME}\` succeeded"
        else
          HEADLINE=":red_circle: *${SERVICE_NAME}* k6 \`${TEST_NAME}\` failed"
        fi

        {
          echo "${HEADLINE}  _(${ENVIRONMENT})_"
          echo
          echo "<${RUN_URL}|GitHub run>"
        } > slack-text.md

        echo "Composed message:"; sed 's/^/  /' slack-text.md

        {
          echo "text<<SLACK_EOF"
          cat slack-text.md
          echo "SLACK_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Notify Slack
      if: ${{ !cancelled() && inputs.slack-notify != 'never' && steps.slack-message.outputs.notify == 'true' && (inputs.runtime == 'github-actions' || inputs.mode != 'deploy') }}
      continue-on-error: true
      uses: extenda/actions/slack-notify@v0
      with:
        service-account-key: ${{ inputs.slack-service-account-key }}
        channel: ${{ inputs.slack-channel }}
        text: ${{ steps.slack-message.outputs.text }}

    - name: Fail if run failed
      if: ${{ (inputs.runtime == 'github-actions' && steps.run-k6.outcome == 'failure') || (inputs.runtime == 'cloud-run-job' && inputs.mode != 'deploy' && steps.execute.outcome == 'failure') }}
      shell: bash
      run: exit 1
